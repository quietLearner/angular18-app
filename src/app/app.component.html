<app-header />
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [user]="user"
          [selected]="user.id === selectedUserId"
          (select)="onUserSelected($event)"
        />
      </li>
    }
  </ul>

  <!-- <ul id="users">
    <li *ngFor="let user of users">
      <app-user [user]="user" (select)="onUserSelected($event)" />
    </li>
  </ul> -->

  @if (selectedUser) {
    <app-tasks [name]="selectedUser.name" [userId]="selectedUser.id" />
  } @else {
    <p>Please select a user to see their tasks.</p>
  }
</main>
